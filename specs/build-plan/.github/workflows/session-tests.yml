# Generated by HyperSpeed build-plan generator.
# Copy this file to .github/workflows/session-tests.yml in your repo root.
name: Session tests
# Dual-trigger pattern (#114): the wave runner opens 3–6 session PRs in rapid
# succession, and GitHub's `pull_request` webhook delivery is unreliable under
# that burst — most PRs in a wave would otherwise get no CI run at all. The
# `push` trigger fires unconditionally on every push to a `bp/**` session
# branch (no webhook lottery), guaranteeing CI runs for every session; the
# `pull_request` trigger still gates merges. `bp/**` matches the runner's
# `bp/<run-id>/<session-id>` branches and deliberately excludes the base branch.
#
# NOTE: when a PR exists, a push fires BOTH triggers → two `test` runs on the
# same head SHA. This is intentional and harmless (either passing run satisfies
# branch protection). For expensive desktop/mobile builds where the duplicate
# minutes matter, add a `concurrency:` group — but avoid `cancel-in-progress`,
# which can cancel the run branch protection is waiting on and block the merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: ['bp/**']
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canary_test
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/canary_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: canary_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install dependencies
        run: bundle install --path vendor/bundle
      - name: Run session test
        shell: bash
        run: |
          set -euo pipefail
          # Session id is the branch suffix: bp/<run-id>/<session-id>.
          # Works for both event types (#114): pull_request populates
          # GITHUB_HEAD_REF; push leaves it empty, so fall back to GITHUB_REF
          # (always set) with the refs/heads/ prefix stripped. The :- default
          # keeps this safe under `set -u`.
          HEAD_REF="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          SESSION_ID=$(echo "${HEAD_REF}" | sed 's|^bp/[^/]*/||')
          # Locate the checked-in manifest anywhere under the repo (it lives in
          # the build-plan dir, whose path relative to the repo root varies).
          MANIFEST=$(find . -name run-manifest.json -path '*build-plan*' 2>/dev/null | head -n1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::run-manifest.json not found under the repo — commit it alongside this workflow."
            exit 1
          fi
          TEST_CMD=$(node -e '
            const m = require(require("path").resolve(process.argv[1]));
            const s = (m.waves || []).flatMap(w => w.sessions || []).find(s => s.id === process.argv[2]);
            process.stdout.write(s && s.test ? s.test.cmd : "");
          ' "$MANIFEST" "$SESSION_ID")
          if [ -z "$TEST_CMD" ]; then
            echo "::error::No test.cmd for session '$SESSION_ID' in $MANIFEST — failing the gate rather than passing silently."
            exit 1
          fi
          echo "Running session test for $SESSION_ID: $TEST_CMD"
          # `eval` is intentional: TEST_CMD comes from the checked-in manifest
          # which is part of the trusted source tree (anyone who could commit a
          # malicious manifest could commit a malicious workflow directly).
          # Using `eval` honors compound commands like `pytest && npm test`
          # and shell quoting that a bare `$TEST_CMD` would split incorrectly.
          eval "$TEST_CMD"
